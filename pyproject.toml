[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataset-doctor"
dynamic = ["version"]
description = "Catch broken YOLO labels before you train on them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "numpy>=1.24",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
dataset-doctor = "dataset_doctor.cli:main"

[tool.hatch.version]
path = "src/dataset_doctor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
